# Kopieren nach config.toml und anpassen.
state_file = "limiter-state.json"   # speichert verbrauchte Airtime über Neustarts
model_state_file = "models-state.json"  # merkt sich die in der App gewählten Modelle

[serial]
port = "/dev/ttyUSB0"               # Heltec V3 (Companion-Firmware, USB)
baud = 115200

[radio]
# Werte werden vom Node gelesen; hier nur eintragen, wenn sie überschrieben werden sollen.
# freq_mhz = 869.618
# bw_khz = 62.5
# sf = 8
# cr = 8
margin = 0.8                        # nutzt nur 80 % des erlaubten Duty-Cycle (Reserve für Adverts/ACKs)
ack_timeout_s = 90
# raw_enabled = true                # Kompaktmodus für öffentliche Antworten erlauben (braucht [gateway] token als gemeinsames Geheimnis)

[llm]
base_url = "http://127.0.0.1:11434"
model = "llama3.1"                 # Standardmodell (in der App überschreibbar)
# models = ["llama3.1", "qwen2.5", "llava"]   # optional: nur diese in der App anbieten (leer = alle von Ollama)
# vision_model = "llava"            # später aktivieren für Bilder
num_predict = 400                   # Antwortlänge begrenzen: jedes Zeichen kostet Funkzeit
history_turns = 6

[limits]
max_object_bytes = 200000
max_context_chars = 12000

[access]
# Public-Key-Präfix (hex, mind. 12 Zeichen) der freigegebenen Handy-Nodes.
# Unbekannte Absender werden im Log mit ihrem Präfix gemeldet.
allowed_peers = []
allow_all = false

# ---------------------------------------------------------------------------------------------
# Project NOMAD (läuft vollständig auf diesem Server, im Intranet direkt unter http://SERVER:8080 erreichbar)
[nomad]
url = "http://127.0.0.1:8080"        # NOMAD Command Center
storage = "/opt/project-nomad/storage"
kiwix_url = "http://127.0.0.1:8090"  # NOMADs Bibliothek (Kiwix) für Artikel-Anfragen
knowledge_base = false               # Standard für LoRa-Chats: NOMADs Wissensdatenbank (RAG) nutzen (in der App je Chat umschaltbar)

# Gateway: EINE abgesicherte Schnittstelle für die App (WLAN/VPN, nicht LoRa)
#  - zeigt in der App dieselbe NOMAD-Oberfläche wie der Browser (NOMAD selbst hat keine Anmeldung -> Token davor)
#  - liefert Karten/Bibliotheken zum einmaligen Download aufs Handy
[gateway]
enabled = false
host = "0.0.0.0"
port = 8765
token = ""                           # mind. 16 Zeichen, z. B.: python -c "import secrets;print(secrets.token_urlsafe(24))"
# exclude = ["ted_", "khan", "kolibri", "video"]   # Dateinamen-Muster, die NICHT angeboten werden (Bildung/Videos)
# max_file_gb = 40
